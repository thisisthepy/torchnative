[package]
name = "torch_c"
version = "0.0.0"
edition = "2021"

# Produces the `torch._C` extension module. Rust prefixes cdylib output with
# `lib`, so the artefact is renamed on install -- Python will only load `_C.so`.
[lib]
name = "_C"
crate-type = ["cdylib"]

[dependencies]
# `abi3-py313` is ABI3.md §7's recommendation, and the floor is exactly 3.13:
# lowering it gives up the 3.13 stable-ABI replacements (`PyObject_GetOptionalAttr`
# and friends, §2c); raising it turns `Py_TYPE` into a call (§4d). The decisive
# argument is not performance but the asymmetry of reverting -- Limited API is a
# subset, so abi3 -> version-pinned needs no source change, while the reverse
# means hunting down every private/struct API already in use (§8).
#
# It also removes a silent failure mode: a version-pinned `_C.so` carries no tag
# and loads into an interpreter it was not built for (§5d). The platform is
# CPython 3.14.7, not the 3.13 this crate had been compiled against.
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py313"] }

# The tensor engine (DESIGN.md §4). `candle-core` only -- `candle-transformers`
# re-implements model architectures in Rust, which is the approach §1 rejects.
# Upstream's default feature set is already empty; it is pinned off here so a
# future upstream default can never quietly link Accelerate/Metal/MKL/CUDA into
# a device build.
#
# Accelerate is enabled per-target below rather than here. docs/PERF.md has the
# measurement: without it a two-layer block runs 7.0x upstream, with it 0.97x,
# and the golden suite is 2258/2258 either way -- which had to be checked rather
# than assumed, BLAS being free to accumulate in a different order. It is
# Apple-only, so this blanket pin stays and the exception is scoped.
candle-core = { version = "0.11.0", default-features = false }

# The GEMM `candle-core` calls when no BLAS feature is on -- which is every
# non-Apple target, Android included. Named here only so `lib.rs` can reach
# `gemm::set_threading_threshold`; the version is the one candle-core already
# resolves, so this adds no code to the artefact (docs/PERF_ANDROID.md §4
# records the before/after sizes).
#
# The coupling is deliberate and it is the reason to keep the version pinned
# rather than floating: if candle-core ever changes its CPU GEMM, this
# dependency stops matching and the build says so, instead of the call silently
# tuning a crate nobody calls any more.
gemm = "0.19.0"

# The `float16`/`bfloat16` scalar types, named for the same reason `gemm` is:
# `src/reduced.rs` calls them, and the version is the one candle-core already
# resolves, so this adds no code to the artefact.
#
# It is the reference implementation and not merely a convenience type. Every
# kernel in `reduced.rs` is checked bitwise against the `half` function it
# replaces -- over all 65536 bit patterns where that set is finite -- and the
# numbers docs/BF16.md pinned this shim to were produced by these very
# functions, so "agrees with `half`" and "agrees with what shipped" are one
# statement rather than two.
half = "2.7"

# Apple only. `target_vendor = "apple"` covers macOS and iOS, device and
# simulator alike, and excludes Android and Linux -- where turning this on would
# not merely be useless but would fail to link, there being no Accelerate
# framework to bind against.
#
# Cargo unions features across a dependency's entries, so this adds `accelerate`
# on top of the pinned-off base rather than replacing it.
#
# `not(torch_c_no_accelerate)` is the one opt-out, and it exists for exactly one
# caller: `scripts/device_android.sh parity` builds its host end with that cfg
# set, into its own CARGO_TARGET_DIR, and measures that build rather than the
# shipped one. Cargo evaluates these `cfg()` keys against `rustc --print cfg`
# *with the target's rustflags applied*, so a `--cfg` in rustflags reaches this
# table (measured -- a probe crate lost its dependency entirely under that flag).
#
# It has to arrive as `--config target."cfg(...)".rustflags`, not as the
# `RUSTFLAGS` environment variable. `RUSTFLAGS` *replaces* the rustflags from
# `.cargo/config.toml` rather than adding to them, which silently drops this
# crate's `-undefined dynamic_lookup` and the host link then fails with a wall
# of undefined `_Py*` symbols (measured -- same trap as building from the wrong
# working directory, docs/TORCH_C.md §3). Two `--config`/config-file rustflags
# entries for the same target are joined, so the link wiring survives.
#
# Why a cfg and not a Cargo feature: a dependency entry's `features = [...]`
# list is static, so making the exception switchable means making the *entry*
# switchable, and the only switchable entries are optional ones -- which have to
# be renamed to be referenced by `dep:`, and a renamed `candle-core` alongside
# the plain one is rejected outright ("depends on crate `candle-core` multiple
# times with different names"). The cfg key switches the entry without
# duplicating it, and it leaves `cargo build --release` -- what
# `vendor/install_shim.sh`, `rust/torch_c/pytests/run.sh` and
# `scripts/device_android.sh build` all run -- spelled exactly as before, with
# no `--no-default-features` sitting around for a future shipping path to copy.
#
# Why parity wants it: with Accelerate on the host and `gemm` on the device the
# two ends run different BLAS, so a bit comparison between them can only restate
# something already known (docs/DEVICE.md §5.1). Off, it is gemm against gemm,
# which is the comparison that can catch a device-specific kernel fault.
#
# What must not happen is this going off for a *shipped* build: that is a 7x
# model-level regression (docs/PERF.md §3) with no other symptom. `parity`
# guards the other direction too -- it refuses to measure a host artefact that
# still links Accelerate, so a cfg key that stops working is a loud failure and
# not a quietly meaningless comparison.
[target.'cfg(all(target_vendor = "apple", not(torch_c_no_accelerate)))'.dependencies]
candle-core = { version = "0.11.0", default-features = false, features = ["accelerate"] }
