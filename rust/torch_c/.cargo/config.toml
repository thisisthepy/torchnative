# Python extension modules resolve their CPython symbols from the interpreter
# that loads them, not from a linked libpython. Apple's linker needs to be told
# that explicitly, or every Py* symbol is an undefined-symbol error.
#
# This is the first concrete case of the per-target link wiring that
# pypackpack's Cargo.kt would have to encode. See docs/RUST_CROSSBUILD.md.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.aarch64-apple-ios]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
