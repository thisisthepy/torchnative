# Per-target link wiring, machine-independent half.
#
# The split is deliberate: anything that is a *constant* for a target lives
# here, and anything that is a *path on the build machine* lives in `build.rs`
# behind an environment variable. Cargo performs no environment expansion inside
# `rustflags`, so a path here can only ever be an absolute one -- which is how
# the iOS `-F` flag came to be hardcoded to a single machine (RUST_CROSSBUILD.md
# §0.5 flags it). See `build.rs` for the contract that replaced it.
#
# Python extension modules resolve their CPython symbols from the interpreter
# that loads them, not from a linked libpython. Apple's linker needs to be told
# that explicitly, or every Py* symbol is an undefined-symbol error.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

# The simulator behaves like macOS here. The physical device does not -- it has
# no libpython3.13.{a,dylib} at all, only Python.framework/Python, so it needs a
# framework search path. That path is injected by `build.rs` from
# TORCHNATIVE_PYTHON_FRAMEWORK_DIR, and PyO3's own (unsatisfiable) `-lpython3.13`
# must be suppressed with PYO3_CONFIG_FILE at the same time.
[target.aarch64-apple-ios-sim]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

# Android needs no extra flags: ELF shared libraries may carry undefined symbols
# and the interpreter resolves them at load time.
