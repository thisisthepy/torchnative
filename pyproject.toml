# Why the non-obvious fields are what they are: PROJECT.md.
# Several of them have been set to the "obvious" value before and broke the
# wheel; PROJECT.md has a section per field saying what broke.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torchnative"
version = "0.1.0b4"
description = "Run the real PyTorch ecosystem on device, not reimplementing it"
readme = { file = "README.md", content-type = "text/markdown" }
# Upstream torch 2.13.0's own License-Expression, verbatim. PROJECT.md.
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"

# `torch` is absent on purpose -- this distribution PROVIDES it. What is listed
# is upstream torch's own pure-Python `Requires-Dist`, minus its CUDA/triton
# entries. PROJECT.md.
dependencies = [
    "filelock",
    "typing-extensions>=4.10.0",
    "setuptools>=77.0.3",
    "sympy>=1.13.3",
    "networkx>=2.5.1",
    "jinja2",
    "fsspec>=0.8.5",
]
authors = [{ name = "thisisthepy" }]
keywords = ["pytorch", "on-device", "edge", "federated-learning", "test-time-adaptation"]

# 3.13 is the abi3 floor, not a ceiling: one `cp313-abi3` wheel serves 3.13 and
# every later CPython. PROJECT.md.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Android",
    "Operating System :: iOS",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/thisisthepy/torchnative"
Documentation = "https://github.com/thisisthepy/torchnative/tree/develop/docs"
Source = "https://github.com/thisisthepy/torchnative"

[project.optional-dependencies]
federated = []
# cpu/gpu are empty deliberately: the wheel carries all backends and selects
# at runtime, and neither has a Python-side runtime dependency (yet). PROJECT.md.
cpu = []
gpu = []
# npu is not empty: the Intel NPU path (torchnative/export/intelnpu.py) reaches
# the device through OpenVINO's C API, and `uv add openvino` ships the
# ENTIRE runtime -- openvino_c plus every plugin, including the NPU plugin --
# inside the package, so no system-wide OpenVINO install is required. The
# marker restricts this to the two platforms the NPU plugin actually ships
# for (Windows and Linux, x86-64 only, per docs/devices/INTELNPU.md section
# 1.3) so it is never dragged onto macOS or an ARM host that has no Intel NPU
# to reach. PROJECT.md.
npu = [
    "openvino; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]
# Upstream torch as the golden harness's comparison baseline, not a runtime
# dependency. Conflicts with the platform wheels by design. PROJECT.md.
test = ["torch>=2.13,<2.14"]

# Without package-dir, auto-discovery treats the repository root as the package
# root and a wheel answers `import python.torchnative` (it once answered
# `import main.torchnative` under the old `torchnative/src/main` layout).
# PROJECT.md.
[tool.setuptools]
package-dir = { "" = "torchnative/python" }

# Three upstream packages, not one -- `torch` alone looked fine for a long time
# because PYTHONPATH shadowed only that one. PROJECT.md.
[tool.setuptools.packages.find]
where = ["torchnative/python"]
include = [
    "torchnative*",
    "torch", "torch.*",
    "torchgen", "torchgen.*",
    "functorch", "functorch.*",
]

# A recursive catch-all, because a per-extension list silently dropped files.
# PROJECT.md.
[tool.setuptools.package-data]
torch = ["**/*"]
torchgen = ["**/*"]
functorch = ["**/*"]
torchnative = ["**/*"]

# `.pyc` would pin an abi3 wheel to the building interpreter's magic number;
# `.DS_Store` is here because one reached a published wheel. PROJECT.md.
[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo", "**/.DS_Store", ".DS_Store"]

[tool.ppp]
# pypackpack. The source set is `python/` (torch + torchnative side by side);
# PROJECT.md §6.7.
