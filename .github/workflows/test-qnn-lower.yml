# Produce the QNN artefact this project's own machine cannot produce.
#
# WHAT THIS JOB PROVES
#   * that `to_edge_transform_and_lower_to_qnn` runs to completion on a real
#     `transformers` submodule, with the real `QnnPartitioner` and the real
#     Qualcomm SDK -- something docs/devices/QNN.md §11 records as never having
#     happened ("`lower()` has never executed ... wired, not run");
#   * that the resulting `.pte` is a QNN program built for the named silicon:
#     `read_artefact(...).is_qnn`, a delegate named `QnnBackend`, and
#     `match_device(art, SOC)` (docs/devices/QNN.md §5 step 7);
#   * what `delegated_fraction` actually is for `LlamaMLP` under
#     `QnnPartitioner`. docs/devices/QNN.md §11 records that number as **UNKNOWN and
#     possibly poor**. Whatever it is, this job prints it.
#
# WHAT THIS JOB PROVES NOTHING ABOUT
#   * **HTP execution.** Nothing here goes near a Hexagon NPU. A hosted runner
#     has no Snapdragon in it. docs/devices/QNN.md §6.1 lists four things that would
#     prove HTP execution and this job can supply exactly one of them --
#     (b), the decoded artefact, which §6.1 itself calls "still a claim about
#     a file". (c) the optrace/QHAS hardware counters and (d) the
#     skeleton-removal negative control both need the physical device, and
#     (d) is the one §6.1 says makes it evidence rather than a plan.
#   * **numbers.** No element-wise comparison against upstream happens here.
#     docs/devices/QNN.md §7.2 and §11 ("No timing, anywhere").
#
#   So a green run means "the artefact exists and is what it says it is".
#   It does not license a single sentence about the NPU. docs/devices/QNN.md §6.4 is
#   the paragraph that must stay true, and `test_qnn.py`'s
#   `test_no_claim_is_made_that_anything_ran_on_an_npu` is what keeps it true.
#
# The artefact this uploads is the input to docs/devices/QNN.md §5 step 8 -- "copy
# layer0_mlp.pte, qnn_executor_runner and libqnn_executorch_backend.so back to
# the host that holds the device". Steps 9-14 are still a human with a phone.
#
# Modelled on `test-published-wheel.yml`, which is this repository's example
# of a CI job careful about the boundary between what it ran and what it
# proved. The verification logic is NOT in this file: it is
# `.github/scripts/qnn_lower.py`, tested by `tests/devices/qnn/test_qnnci.py` on a
# machine that has no executorch. AGENTS.md §17.5 -- logic that lives only in a
# `run: |` block can never be tested, only pushed and watched.
name: qnn lower

on:
  workflow_dispatch:
    inputs:
      soc_model:
        description: >-
          Qualcomm chipset to build the HTP context binary for. Must be a name
          in ExecuTorch's own QcomChipset table. The default is the device this
          project actually has (AGENTS.md §19, docs/devices/QNN.md §5.1: Galaxy Tab S9
          Ultra, ro.soc.model=SM8550, HTP v73) and NOT the SM8650 the doc's
          example line uses -- SM8650 is HTP v75, and an artefact built for v75
          is refused by v73 at backend init with the method load aborting
          (docs/devices/QNN.md §6.3). Read it off the device with
          `adb shell getprop ro.soc.model` rather than assuming it.
        required: false
        default: "SM8550"
      runner:
        description: >-
          Runner image. See the "Ubuntu version" note on the `lower` job.
        required: false
        default: "ubuntu-24.04"
      model_id:
        description: "HF model id to take the submodule from"
        required: false
        default: "HuggingFaceTB/SmolLM2-135M"
      submodule:
        description: >-
          Dotted path of the submodule to lower. docs/devices/QNN.md §11: "No whole
          model, only one submodule" -- layer 0's MLP is the smallest thing
          that makes the claim real.
        required: false
        default: "model.layers.0.mlp"
  push:
    # Same convention as test-published-wheel.yml: changes to the job or to
    # the logic it runs re-run it, so a broken edit is found by the edit rather
    # than by the next person who dispatches it.
    paths:
      - ".github/workflows/test-qnn-lower.yml"
      - ".github/scripts/qnn_lower.py"
      - "torchnative/python/torchnative/export/qnn.py"

permissions:
  contents: read

env:
  # docs/devices/QNN.md §1.1, "The four numbers". Every one of these is pinned, and
  # pinned to the value the doc measured rather than to "latest":
  #
  #   executorch 1.4.1        the release §1.3's measurement was taken against
  #   QNN SDK 2.37.0.250724   ExecuTorch's own pin. `pip install executorch`
  #                           fetches it automatically on linux-x86
  #                           (backends/qualcomm/__init__.py gating on
  #                           is_linux_x86()), so this is ASSERTED here rather
  #                           than installed -- if ExecuTorch's pin has moved,
  #                           the job should say so, not silently lower against
  #                           a different SDK than docs/devices/QNN.md describes.
  #   NDK r26c                "This example is verified with NDK 26c"
  #   transformers 5.15.1     the version pinned in this project's spike-venv,
  #                           i.e. the one every other claim in docs/devices/QNN.md was
  #                           measured under. Not "latest": a Llama attribute
  #                           rename upstream would change which module gets
  #                           lowered without changing this file.
  #   Python 3.13             the abi3 floor this project targets, and the
  #                           interpreter §1.3's measurement used.
  EXECUTORCH_VERSION: "1.4.1"
  EXPECTED_QNN_SDK_VERSION: "2.37.0.250724"
  ANDROID_NDK_VERSION: "26.3.11579264" # r26c, as sdkmanager names it
  TRANSFORMERS_VERSION: "5.15.1"
  PYTHON_VERSION: "3.13"

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # The job that carries the claim. docs/devices/QNN.md §5 steps 4, 6 and 7.
  # ═══════════════════════════════════════════════════════════════════════
  lower:
    name: lower layer0 mlp to QNN

    # ── The Ubuntu version, decided rather than defaulted ──────────────────
    #
    # docs/devices/QNN.md §1.1 records Qualcomm's verified host list: "Ubuntu 22.04 LTS
    # (x64), CentOS Stream 9, WSL with Ubuntu 22.04". So the obvious move is
    # `ubuntu-22.04`. It is NOT what this pins, for three reasons, and the
    # third is the one that decides it:
    #
    #  1. `ubuntu-22.04` is on GitHub's runner-image retirement path. A job
    #     pinned to a retired image does not fail informatively -- it fails to
    #     schedule, which reads as "CI is broken" rather than "the pin expired".
    #  2. §1.1 also requires **g++ 13 or higher** for the AOT part. Ubuntu
    #     22.04 ships g++ 11 and would need the toolchain PPA; 24.04 ships
    #     g++ 13 as its default. So 22.04 satisfies one half of §1.1 only by
    #     violating the other half until patched.
    #  3. What "verified on 22.04" actually buys is that the SDK's prebuilt
    #     x86-64 host objects (libQnnHtp.so and friends) find a new enough
    #     glibc/libstdc++. Prebuilt ELF objects are forward compatible with
    #     newer glibc and not backward compatible with older, so 24.04
    #     (glibc 2.39) is the SAFE direction from 22.04 (glibc 2.35). The risky
    #     direction would have been an older image, and there is no older image.
    #
    # It is pinned to `ubuntu-24.04` and not `ubuntu-latest` so that the host
    # this measurement was taken on cannot change under it without a commit --
    # docs/devices/QNN.md's numbers are keyed to hosts.
    #
    # If the SDK does turn out to refuse this image, that is a real finding and
    # docs/devices/QNNCI.md says to record it; the `runner` input exists so it can be
    # re-run on another image to confirm, WITHOUT editing this file first.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: What we are standing on
        # docs/devices/QNN.md §1.3's whole argument is about host arch. If this is ever
        # not linux/x86_64 the rest of the job is meaningless, so it refuses
        # here by name rather than producing a confusing ImportError later.
        run: |
          set -euo pipefail
          uname -a
          python -c "import platform, sys; print(platform.system(), platform.machine(), sys.version)"
          g++ --version | head -1
          python - <<'PY'
          import platform, sys
          system, machine = platform.system().lower(), platform.machine().lower()
          if system != "linux" or machine not in ("x86_64", "amd64"):
              sys.exit(
                  f"this job requires a linux x86-64 host and got {system}/{machine}. "
                  "docs/devices/QNN.md §1.3: the QNN SDK's host libraries exist only under "
                  "lib/x86_64-linux-clang and ExecuTorch's installer gates on "
                  "is_linux_x86()."
              )
          print("host ok:", system, machine)
          PY

      - name: Install upstream torch, executorch and transformers
        # docs/devices/QNN.md §5 step 4. NOTE the deviation from the doc, and the
        # reason: the doc's step 4 sources `$QNN_SDK_ROOT/bin/envsetup.sh` from
        # a manually installed SDK at /opt/qcom/aistack. That path does not
        # exist on a hosted runner and there is no license-free way to put it
        # there in a job. The doc's own step 4 names the alternative in its
        # first line -- "`pip install executorch` fetches it automatically on
        # linux-x86 (backends/qualcomm/__init__.py)" -- and that is the branch
        # taken here. It is the doc's recipe, not a different one.
        #
        # This deliberately does NOT install this project's shim. The lowering
        # is upstream torch and upstream executorch (docs/devices/QNN.md §2); the shim
        # would substitute this project's torch.export, which docs/graph/EXPORT5.md
        # §0 measures at 0 of 40 architectures. `.github/scripts/qnn_lower.py` asserts
        # the shim is absent rather than trusting this comment.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "executorch==${EXECUTORCH_VERSION}" \
            "transformers==${TRANSFORMERS_VERSION}" \
            py-cpuinfo
          python -m pip list

      - name: Fetch the QNN SDK and check ExecuTorch's pin has not moved
        # Importing `executorch.backends.qualcomm` is what triggers
        # `install_qnn_sdk()` on a linux-x86 host -- the fetch is an import
        # side effect, not a pip side effect, so it has to be provoked.
        #
        # The version is READ from
        # `backends/qualcomm/scripts/download_qnn_sdk.py` (via
        # `qnn.qnn_sdk_version()`, which resolves it from `qnn_config.sh` and
        # falls back to the literal) and compared against the pin. It is not
        # transcribed -- docs/devices/QNN.md §1.1 is explicit that transcribing it is
        # the mistake. A mismatch FAILS: docs/devices/QNN.md's §1.1 numbers describe
        # 2.37.0.250724, and an artefact built against a different SDK is not
        # the thing this job's header claims to produce.
        run: |
          set -euo pipefail
          PYTHONPATH=python python - <<'PY'
          import os, sys, traceback
          from torchnative.export import qnn

          # The import below is what triggers the SDK download, and it is the
          # single most likely place for this job to die (docs/devices/QNNCI.md §6
          # item 1: the linux-x86_64 wheel may also lack PyQnnManagerAdaptor,
          # which §1.3 only measured on the macOS arm64 wheel). Letting it
          # raise bare would end the job with a traceback whose top frame is
          # some op builder -- so it is caught, and the WALL IS NAMED via
          # `qnn_aot_refusal()`, which reports which module is missing.
          # AGENTS.md §18: refusals give their name and their reason.
          try:
              import executorch.backends.qualcomm  # noqa: F401
          except Exception:
              traceback.print_exc()
              sys.exit(
                  "importing executorch.backends.qualcomm failed on this "
                  "runner, so install_qnn_sdk() never ran.\n"
                  f"qnn_aot_refusal(): {qnn.qnn_aot_refusal()}\n"
                  "docs/devices/QNNCI.md §6 item 1 and item 2 are the two shapes this "
                  "takes. Do NOT weaken qnn_aot_refusal() -- it is reporting "
                  "correctly."
              )
          print("qnn_aot_refusal:", qnn.qnn_aot_refusal())
          version, url = qnn.qnn_sdk_version()
          print("QNN_SDK_ROOT =", os.environ.get("QNN_SDK_ROOT"))

          # Carry the SDK into the LATER steps. `install_qnn_sdk()` sets
          # QNN_SDK_ROOT inside THIS process only, and each `run:` block is a
          # new shell, so without this the lowering step starts with neither
          # the root nor the loader path. The first run died exactly there:
          # "Failed to initialize QNN backend for kHtpBackend. Ensure QNN SDK
          # libraries are available (e.g. LD_LIBRARY_PATH includes
          # $QNN_SDK_ROOT/lib/x86_64-linux-clang/)" -- which is docs/QNN.md §5
          # step 4's `export LD_LIBRARY_PATH=...` line, missing.
          root = os.environ.get("QNN_SDK_ROOT")
          if not root:
              sys.exit("install_qnn_sdk() ran but set no QNN_SDK_ROOT")
          hostlib = os.path.join(root, "lib", "x86_64-linux-clang")
          if not os.path.isdir(hostlib):
              sys.exit(f"no host libraries at {hostlib}")
          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a") as handle:
                  handle.write(f"QNN_SDK_ROOT={root}\n")
                  handle.write(
                      "LD_LIBRARY_PATH=" + hostlib + ":"
                      + os.environ.get("LD_LIBRARY_PATH", "") + "\n"
                  )
          print("host libraries =", hostlib)
          print("QNN SDK version =", version)
          print("QNN SDK url     =", url)
          expected = os.environ["EXPECTED_QNN_SDK_VERSION"]
          if version != expected:
              sys.exit(
                  f"ExecuTorch {os.environ['EXECUTORCH_VERSION']} now pins QNN SDK "
                  f"{version}, not the {expected} that docs/devices/QNN.md §1.1 measured and "
                  f"this workflow pins. That is a real change, not a flake: re-measure "
                  f"§1.1 and update EXPECTED_QNN_SDK_VERSION in the same commit."
              )
          print("qnn sdk pin ok:", version)
          PY

      # ═══════════════════════════════════════════════════════════════════
      # docs/devices/QNN.md §5 step 6 (lower) and step 7 (verify), in one process.
      #
      # There is no `|| true`, no `continue-on-error` and no `if: always()`
      # on this step, on purpose: it is the step whose failure must stop the
      # upload. `test_qnnci.py` asserts that absence rather than trusting it.
      # ═══════════════════════════════════════════════════════════════════
      - name: Lower and verify
        id: lower
        run: |
          set -euo pipefail
          python .github/scripts/qnn_lower.py \
            --soc-model "${{ inputs.soc_model || 'SM8550' }}" \
            --model-id "${{ inputs.model_id || 'HuggingFaceTB/SmolLM2-135M' }}" \
            --submodule "${{ inputs.submodule || 'model.layers.0.mlp' }}" \
            --out layer0_mlp.pte \
            --facts-json delegation_report.json

      # The report is uploaded even when the run is red, and BEFORE the
      # artefact gate below. When this job fails, `delegation_report.json` is
      # the thing somebody needs -- docs/devices/QNN.md §11 asked for that number and a
      # red run that threw it away would have answered nothing.
      - name: Upload the delegation report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnn-delegation-report
          path: delegation_report.json
          if-no-files-found: warn

      # ── The gate ────────────────────────────────────────────────────────
      #
      # `steps.lower.outputs.integrity_ok` is written by
      # `.github/scripts/qnn_lower.py`. It is 'true' only when the file IS a QNN
      # program named QnnBackend and built for this silicon.
      #
      # `always() && ... == 'true'` rather than plain `success()`, and the
      # difference is the whole design (see .github/scripts/qnn_lower.py's docstring):
      #
      #   integrity failed -> not uploaded. The file is not what this job would
      #     be labelling it. docs/devices/QNN.md §6.2 row 1: it would still load, still
      #     run and still give the right answer, on the CPU.
      #   coverage failed (delegated_fraction below §5 step 6's 0.9) -> the job
      #     is RED and the artefact IS uploaded. It is a genuine QNN program
      #     that the partitioner barely claimed, which is precisely the
      #     measurement docs/devices/QNN.md §11 says is missing. Deleting it would be
      #     deleting the answer.
      #
      # This is not `|| true` on an assertion: the assertion still fails the
      # job. It only decides what survives the failure.
      - name: Upload the QNN artefact
        if: always() && steps.lower.outputs.integrity_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qnn-pte-${{ inputs.soc_model || 'SM8550' }}
          path: |
            layer0_mlp.pte
            delegation_report.json
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # The other two files docs/devices/QNN.md §5 step 8 says to copy to the device.
  # ═══════════════════════════════════════════════════════════════════════
  android-runtime:
    name: build qnn_executor_runner (arm64-v8a)
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}

    # `continue-on-error` at the JOB level, and this is the one place in this
    # workflow where it appears. The reason is not tolerance for failure -- it
    # is that this job and `lower` answer different questions and coupling them
    # would let the smaller one suppress the larger:
    #
    #   * `lower` produces the artefact that carries the claim. docs/devices/QNN.md
    #     §11 says `lower()` has never executed; that is the gap being closed.
    #   * this job produces `qnn_executor_runner` and
    #     `libqnn_executorch_backend.so`, which are a CONVENIENCE. They are
    #     ordinary ExecuTorch build outputs, they contain nothing measured, and
    #     any Linux x86-64 host with the NDK can produce them by running
    #     `backends/qualcomm/scripts/build.sh` (docs/devices/QNN.md §5 step 5).
    #
    # Task item 3 says these are wanted "if the build produces them". An NDK or
    # CMake breakage here must not turn a successful, verified lowering into a
    # run somebody reads as failed. It IS still reported red on its own line.
    #
    # NOTHING in the `lower` job is continue-on-error, and no assertion
    # anywhere in this file is `|| true`'d. test_qnnci.py checks both.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install NDK r26c
        # docs/devices/QNN.md §1.1: "This example is verified with NDK 26c". Hosted
        # ubuntu runners ship an Android SDK with a *different* NDK default, so
        # the pinned one is installed explicitly rather than inherited --
        # inheriting it would mean the version this builds against changes when
        # GitHub rolls its image.
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build ExecuTorch with the QNN backend, AOT + arm64-v8a runtime
        # docs/devices/QNN.md §5 step 5, verbatim in intent: build.sh produces
        # build-x86/ (the AOT half) and build-android/ (qnn_executor_runner +
        # libqnn_executorch_backend.so) with -DEXECUTORCH_BUILD_QNN=ON,
        # -DANDROID_ABI=arm64-v8a, -DANDROID_PLATFORM=android-30 and
        # -DEXECUTORCH_ENABLE_EVENT_TRACER=ON. The event tracer is not
        # optional: docs/devices/QNN.md §6.1(c) and §5 step 12 need it for the
        # optrace/QHAS hardware counters, which are the only per-operation
        # answer to "which unit ran this".
        #
        # DEVIATION from the doc: the doc clones nothing because it assumes an
        # $EXECUTORCH_ROOT already on the host. There is none here, so the tag
        # matching EXECUTORCH_VERSION is cloned. Pinned to the tag, not main --
        # a runtime built from a different ExecuTorch than the one that lowered
        # the .pte is a version-skew failure mode with no good symptom.
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${EXECUTORCH_VERSION}" \
            https://github.com/pytorch/executorch.git executorch
          cd executorch
          git submodule update --init --recursive --depth 1
          python -m pip install --upgrade pip
          ./install_requirements.sh
          export EXECUTORCH_ROOT="$PWD"
          ./backends/qualcomm/scripts/build.sh
          ls -la build-android || true
          find . -name qnn_executor_runner -o -name libqnn_executorch_backend.so

      - name: Collect the two device-side files
        run: |
          set -euo pipefail
          mkdir -p device-side
          find executorch -name qnn_executor_runner -type f -exec cp {} device-side/ \;
          find executorch -name libqnn_executorch_backend.so -type f -exec cp {} device-side/ \;
          ls -la device-side
          test -f device-side/qnn_executor_runner
          test -f device-side/libqnn_executorch_backend.so
          file device-side/* || true

      - name: Upload the device-side runtime
        uses: actions/upload-artifact@v4
        with:
          name: qnn-android-runtime-arm64-v8a
          path: device-side/
          if-no-files-found: error
